<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .header {
            background: linear-gradient(180deg, #8c93b0 0%, whitesmoke 100%);
            border-radius: 15px 15px 0 0;
            padding: 20px;
            display: flex;
            align-items: center;
        }
        .text {
            margin-left: auto;
            text-align: right;
            font-size: 20px;
            font-weight: 600;

        }
        .content {
            padding: 20px;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            background-color: whitesmoke;
            border-radius: 12px;
            border: 1px solid #8c93b0;

        }
        .content ul{
            list-style-type: none;
            padding: 0;
            
        }
    </style>
</head>

<body style="background-color: whitesmoke">
<div class="header">
    <img src="https://raw.githubusercontent.com/Tyna1992/PetProject/main/VineyardSite/Client/VineyardSiteClient/public/Images/logo.jpg" alt="logo" style="width: 10rem; height: 10rem">
    <h1>Thank you for your message, #user!</h1>
    <div class="text">
        <p></p>
        <p>The bottled tradition</p>
    </div>

</div>
<div class="content">
    <p>Request for wine tasting!</p>
    <p>The details of the request:</p>
    <ul>
        <li>Name: #name</li>
        <li>Wine tasting date: #date</li>
        <li>Phone number: #phone</li>
        <li>Number of participants: #participants</li>
        <li>Message: #details </li>
    </ul>       

</div>
</body>
</html>
